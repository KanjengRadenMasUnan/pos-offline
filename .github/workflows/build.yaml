name: Build Split APK Flutter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Command kunci untuk split per ABI
      - name: Build Split APK
        run: flutter build apk --split-per-abi --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-split-apks
          path: build/app/outputs/flutter-apk/app-*.apk
